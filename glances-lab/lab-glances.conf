# Lab config for the Glances guide: thresholds set deliberately low
# so the alert machinery fires on an ordinary busy sandbox minute.
# Compare with the shipped defaults: cpu user 50/70/90, mem 50/70/90.

[global]
refresh=2
check_update=false

[cpu]
user_careful=5
user_warning=10
user_critical=20
system_careful=5
system_warning=10
system_critical=20
total_careful=10
total_warning=20
total_critical=40

[mem]
careful=50
warning=70
critical=85

[load]
careful=0.5
warning=0.8
critical=2.0
